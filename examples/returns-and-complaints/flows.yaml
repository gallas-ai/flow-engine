# Returns and complaints. Only the flow logic: the texts are in responses.<language>.yaml.
flows:
  refund:
    name: Refund
    description: The customer wants to return an item that is fine and get the money back.
    steps:
      - collect: order_number
        description: the order number, e.g. 10234
      - action: utter_refund_started

  complaint:
    name: Complaint
    description: The customer reports a broken or damaged item.
    steps:
      - collect: order_number
        description: the order number, e.g. 10234
      - action: utter_complaint_opened
